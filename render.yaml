services:
  - type: web
    name: kanachakumb-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://kanachakumb.vercel.app
      - key: ENVIRONMENT
        value: production

databases:
  - name: kanachakumb-db
    databaseName: kanachakumb
    user: kanachakumb
    plan: free
